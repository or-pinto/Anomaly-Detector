[tool.poetry]
name = "robot-anomaly-detection"
version = "0.1.0"
description = "Machine learning system for robot anomaly detection"
authors = ["Noam Amar", "Or Pinto"]

[tool.poetry.dependencies]
python = "^3.8"
numpy = "^1.24.0"
pandas = "^2.0.0"
matplotlib = "^3.7.0"
scikit-learn = "^1.2.0"
pyarrow = "^14.0.1"  # for parquet support
joblib = "^1.3.0"

[tool.poetry.dev-dependencies]
jupyter = "^1.0.0"
black = "^23.0.0"
isort = "^5.12.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"